<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شاركينا حبك | السعودية خط أحمر</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <a class="brand" href="home.html">
    <span class="brand-mark">🇸🇦</span>
    <span>
      <strong>السعودية خط أحمر</strong>
      <small>مدرسة شقصان للطفولة المبكرة</small>
    </span>
  </a>

  <nav class="always-nav">
    <a href="home.html">الرئيسية</a>
    <a href="pledge.html">وثيقة العهد</a>
    <a href="rumors.html">أصد الشائعات</a>
    <a href="wall.html">جدارية الوطن</a>
  </nav>
</header>

<main class="section page-section">

  <div class="section-heading">
    <span class="eyebrow">المحطة الثالثة</span>
    <h2>شاركينا <em>حبك</em></h2>
    <p>اتركي رسالة وطنية جميلة تعبّر عن حبك وولائك لوطننا الغالي.</p>
  </div>

  <form class="panel share-form" id="shareForm">

    <label for="shareName">اسم المشاركة (اختياري)</label>
    <input
      id="shareName"
      maxlength="100"
      placeholder="اسمك أو اتركيه فارغًا"
    >

    <label for="shareMessage">رسالتك الوطنية</label>
    <textarea
      id="shareMessage"
      required
      maxlength="600"
      rows="4"
      placeholder="أكتب للوطن..."
    ></textarea>

    <p class="form-note">
      تُراجع الرسائل قبل اعتمادها ونشرها في جدارية الوطن.
    </p>

    <button class="btn btn-primary" type="submit">
      إرسال الرسالة للمراجعة ♡
    </button>

  </form>

  <div class="notice" id="shareNotice" hidden></div>

</main>

<footer>
  <a class="btn btn-ghost" href="home.html">
    العودة إلى الرئيسية
  </a>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="share.js"></script>

</body>
</html>
